# SPDX-License-Identifier: MIT
# omamobile-sitd settings (device/cheetah/MODEM-CLIENT.md). Changes apply at
# the next start of omamobile-sitd, which needs a fresh CP: reboot.

[network]
# Every key below is commented out at its default: a device package's
# defaults (/usr/lib/omamobile/modem-sit.d/) apply unless set here. SIM 2
# reads /etc/omamobile/modem-sit-2.conf the same way.
# The physical SIM slot sitd's stack uses: empty leaves the modem's own
# choice. Raven: 0 is the tray, 1 the eSIM (its modem keeps the last
# Android's choice).
#sim_slot =
# The modem stack (logical SIM, SIT channel umts_ipc<stack>) sitd talks
# to: 0, or 1 to run as stock does with a tray card and an eSIM (the eSIM
# on stack 1, both stacks active).
#stack = 0
# Both SIMs at once: stacks = 2 here (SIM 1, stack 0) and a second file,
# /etc/omamobile/modem-sit-2.conf, with stack = 1 and its own apn; leave
# sim_slot empty in both (the modem's own mapping stays), and enable
# omamobile-sitd-2.service. Each SIM asks for its own PIN:
# omamobile-sit [--sim 2] sim-pin.
#stacks = 1
# How the shell names this SIM. Empty: "SIM n (slot name)" from the modem's
# slot table, with the physical slots named by slot_names in slot order
# (raven: "tray, eSIM"; empty: "slot 1", "slot 2").
#label =
#slot_names =
# The data bearer (rmnet0, behind omamobile-sit-data). With two SIMs the
# modem gives data to one only: say no on the other, or its start-up waits
# on a request the modem never answers.
#data = yes
# How the radio is switched: "at" (AT+CFUN, cheetah) or "sit" (SIT radio
# power after SET_MODEM_CONFIG 1, as stock; raven needs it to register).
#radio = at
# The carrier's internet APN, as the carrier publishes it. Required: without
# it the start-up stops before the radio is switched on.
#apn =
# The internet bearer's IP type: ipv4v6, ipv4 or ipv6. The cellular route
# (omamobile-sit-data) is IPv4 only for now.
#ip_type = ipv4v6
# IMS (VoLTE calls and SMS over IMS). The IMS APN is "ims" on most carriers.
#ims = yes
#ims_apn = ims
# Also hand the modem an IMS data profile (ID 2, ims_apn) before the IMS
# bearer, as stock Android does. Raven needs it (status 2253 without);
# cheetah's start-up registered without it.
#ims_profile = no
# Who brings up the IMS bearer: "ap" (sitd requests it, then ADD_PDN_INFO;
# cheetah) or "modem" (the modem's IMS stack does it once started; try on
# raven, whose firmware refused an AP-requested one with 2253).
#ims_bearer = ap
# The IMS bearer's IP type: ipv6 (cheetah's carrier) or ipv4v6. Raven's
# network refused an IPv6-only IMS bearer: 2253, PDN_IPV6_CALL_DISALLOWED.
#ims_ip_type = ipv6
# nr = off keeps the modem on LTE (NR mode byte 3 -> 0; the original is kept
# in RAM). On this phone NR registered but carried no traffic. "on" leaves
# the modem's own setting alone.
#nr = off
# Seconds to wait for the SIM, then for packet registration.
#sim_timeout = 120
#register_timeout = 180

[data]
# Reserved: the route's metric is fixed at 700 (Wi-Fi's default is 600).
#metric = 700

[control]
# Members of this group may use the calls/SMS socket (root always can).
#group = wheel

[audio]
# The AoC sound card: "auto" finds it in /proc/asound/cards; "none" connects
# calls without routing audio (diagnosis only).
#card = auto
# Microphone gain above stock's 130 cB during calls: 6 (default, judged
# louder and clean in calls on this phone) or 0 (stock).
#mic_boost_db = 6
